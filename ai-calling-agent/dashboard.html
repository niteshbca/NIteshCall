<!doctype html><meta charset="utf-8"><title>AI Calling Agent</title><style>body{font:16px system-ui;max-width:750px;margin:40px auto;background:#f5f7fb}textarea,input,button{display:block;box-sizing:border-box;width:100%;padding:12px;margin:12px 0}pre{white-space:pre-wrap}</style><h1>AI Calling Agent</h1><p>One customer at a time • Message-based answers • 10-minute limit</p><input id="url" value="http://127.0.0.1:8080" placeholder="API URL"><input id="token" type="password" placeholder="Admin token"><textarea id="numbers" rows="6" placeholder="Phone numbers, one per line"></textarea><textarea id="message" rows="8" placeholder="Business message and FAQ answers"></textarea><button id="start">Start campaign</button><button id="stop">Stop after current call</button><pre id="result"></pre><script>let cid,timer;const el=id=>document.getElementById(id);async function api(path,method='GET',body){const r=await fetch(el('url').value+path,{method,headers:{Authorization:'Bearer '+el('token').value,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data}el('start').onclick=async()=>{try{const d=await api('/campaigns','POST',{numbers:el('numbers').value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean),message:el('message').value});cid=d.id;clearInterval(timer);timer=setInterval(async()=>{try{const s=await api('/campaigns/'+cid);el('result').textContent=JSON.stringify(s,null,2);if(s.status!=='running')clearInterval(timer)}catch(e){el('result').textContent=e.message;clearInterval(timer)}},2000)}catch(e){el('result').textContent=e.message}};el('stop').onclick=async()=>{if(cid)el('result').textContent=JSON.stringify(await api('/campaigns/'+cid+'/stop','POST'))};</script>
